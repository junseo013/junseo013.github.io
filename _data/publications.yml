# Publications, newest first. Add a new paper by copying an entry to the top.
#
# id:          unique key, used for the BibTeX toggle (e.g. lee-isca27)
# venue:       badge text (e.g. "HPCA'26")
# venue_class: badge color, defined in assets/css/styles.css as .venue-<venue_class>
#              (unknown values fall back to gray)
# venue_url:   conference website
# title / url: paper title and link (arXiv, ACM DL, IEEE Xplore, ...)
# authors:     "Junseo Lee" is emphasized automatically
# proceedings: venue line shown under the authors (HTML allowed)
# links:       buttons shown below; type is one of pdf, slides, video, poster
# bibtex:      pasted as-is

